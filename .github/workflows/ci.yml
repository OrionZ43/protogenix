# CI: анализ, тесты и пробные сборки на каждый pull request (от Dependabot,
# Jules или свой) и на push в master. Секреты не нужны и не используются:
# Android собирается без release-ключа (build.gradle.kts тогда подписывает
# debug-ключом), а подпись и публикация релизов остаются за tool/release.ps1
# на машине Orion (.claude/rules/release.md).
name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Та же версия, что у Orion (flutter --version); менять вместе
  FLUTTER_VERSION: "3.44.4"
  # Базовый уровень flutter analyze (.claude/rules/known-issues.md): больше —
  # значит, появились новые замечания. Исправили старые — уменьшить.
  ANALYZE_BASELINE: "6"

jobs:
  analyze:
    name: flutter analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Замечаний не больше базового уровня
        shell: bash
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings | tee analyze.txt
          count=$(grep -oE '[0-9]+ issues? found' analyze.txt | grep -oE '^[0-9]+' || true)
          count=${count:-0}
          echo "Замечаний: $count, базовый уровень: $ANALYZE_BASELINE"
          if [ "$count" -gt "$ANALYZE_BASELINE" ]; then
            echo "::error::flutter analyze: $count замечаний при базовом уровне $ANALYZE_BASELINE"
            exit 1
          fi

  windows:
    name: Тесты и сборка Windows
    # Visual Studio 2026, как у Orion (flutter doctor). Что под неё пришлось
    # поправить — .claude/rules/known-issues.md.
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Тесты — на Windows, как у Orion (sqflite в тестах идёт через FFI)
      - run: flutter test
      - run: flutter build windows --release
      # Чтобы проверить обновление зависимости (например, youtube_explode_dart)
      # живым скачиванием без сборки у себя: распаковать и запустить
      # protogenix.exe, закрыв установленную версию (второй экземпляр сразу
      # закрывается). Данные у них общие.
      - uses: actions/upload-artifact@v4
        with:
          name: protogenix-windows-x64
          path: build/windows/x64/runner/Release/
          retention-days: 7

  android:
    name: Сборка Android (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --target-platform android-arm64
