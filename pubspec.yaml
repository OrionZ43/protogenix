name: protogenix
description: Next-gen music player.
publish_to: none
version: 1.1.0+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  device_info_plus: ^12.4.0
  package_info_plus: ^8.1.0
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  just_audio: ^0.9.40
  audio_session: ^0.1.21

  # ── Фоновое воспроизведение ───────────────────────────────────────────────
  # Управление с экрана блокировки, шторки уведомлений, CarPlay, WearOS
  audio_service: ^0.18.13

  flutter_animate: ^4.5.0
  dynamic_color: ^1.7.0
  path_provider: ^2.1.4
  dio: ^5.6.0
  permission_handler: ^11.3.1
  palette_generator: ^0.3.3+3

  # База данных
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # YouTube. Форк 3.1.0 с одним исправлением: трансляция в выдаче роняла весь
  # поиск (known-issues.md). Вернуться на pub.dev, когда исправление выйдет
  # в релизе у автора (dependencies.md).
  youtube_explode_dart:
    git:
      url: https://github.com/OrionZ43/youtube_explode_dart.git
      ref: 4dee1fcd033cbffe7a18ec7a17de38e02a8aeea2

  scrollable_positioned_list: ^0.3.8
  string_similarity: ^2.0.0
  open_file: ^3.5.7
  flutter_svg: ^2.3.0

  # HTTP (нужен importer_service)
  http: ^1.2.1
  sqflite_common_ffi: ^2.4.0+3
  window_manager: ^0.5.1
  just_audio_media_kit: ^2.1.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  file_picker: ^11.0.2
  url_launcher: ^6.3.2
  crypto: ^3.0.7
  cryptography: ^2.9.0
  audio_metadata_reader: ^1.8.0
  desktop_drop: ^0.8.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/mock/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/icon_windows.png"
  min_sdk_size: 21 # Required for android adaptive icons
  windows:
    generate: true
    image_path: "assets/images/icon_windows.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/images/icon_windows.png"

  # Настройки Android Adaptive и Material 3 Monochrome
  adaptive_icon_background: "#080810"
  adaptive_icon_foreground: "assets/images/icon_foreground.png"
  adaptive_icon_monochrome: "assets/images/icon_monochrome.png"