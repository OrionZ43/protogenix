name: protogenix
description: Next-gen music player.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  just_audio: ^0.9.40
  audio_session: ^0.1.21

  # ── Фоновое воспроизведение ───────────────────────────────────────────────
  # Управление с экрана блокировки, шторки уведомлений, CarPlay, WearOS
  audio_service: ^0.18.13

  flutter_animate: ^4.5.0
  dynamic_color: ^1.7.0
  path_provider: ^2.1.4
  dio: ^5.6.0
  permission_handler: ^11.3.1
  palette_generator: ^0.3.3+3

  # База данных
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # YouTube
  youtube_explode_dart: ^3.0.5

  scrollable_positioned_list: ^0.3.8
  string_similarity: ^2.0.0

  # HTTP (нужен importer_service)
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/mock/